<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Action Space Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#12151c;
    --panel-border:#232837;
    --text:#e7ecf3;
    --text-dim:#8892a4;
    --accent:#5fd4c0;
    --accent-dim:#2c5a52;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
  #app{position:relative;width:100vw;height:100vh;}
  #canvas-wrap{position:absolute;inset:0;}
  canvas{display:block;}

  #panel{
    position:absolute;top:16px;left:16px;width:268px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:16px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
    font-size:12.5px;
  }
  #panel h1{
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);margin:0 0 2px 0;font-weight:600;
  }
  #panel .sub{color:var(--text-dim);font-size:11px;margin-bottom:14px;}
  .row{margin-bottom:10px;}
  .row label{
    display:block;color:var(--text-dim);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;
  }
  .row.axis-x label{color:#ff8a80;}
  .row.axis-y label{color:#82e0aa;}
  .row.axis-z label{color:#82b1ff;}
  select{
    width:100%;background:#1a1f2b;color:var(--text);
    border:1px solid var(--panel-border);border-radius:6px;
    padding:6px 8px;font-size:12.5px;font-family:var(--sans);
    appearance:none;cursor:pointer;
  }
  select:focus{outline:1px solid var(--accent);}
  .divider{height:1px;background:var(--panel-border);margin:14px 0;}
  .colorswatch{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:6px;vertical-align:middle;
  }
  .toggles label{
    display:flex;align-items:center;gap:6px;color:var(--text);
    font-size:12px;margin-bottom:6px;cursor:pointer;
  }
  input[type=checkbox]{accent-color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  #hint{color:var(--text-dim);font-size:10.5px;line-height:1.5;margin-top:12px;}

  #tooltip{
    position:absolute;pointer-events:none;
    background:rgba(15,18,25,.95);border:1px solid var(--panel-border);
    border-radius:6px;padding:6px 9px;font-family:var(--mono);
    font-size:11.5px;color:var(--text);display:none;white-space:nowrap;
    z-index:20;
  }
  #tooltip .name{color:var(--accent);font-weight:600;}
  #tooltip .f{color:var(--text-dim);}

  .labelDiv{
    position:absolute;pointer-events:none;color:#c9d1e0;
    font-family:var(--mono);font-size:10px;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6);
    transform:translate(6px,-6px);white-space:nowrap;
  }

  #legend{
    position:absolute;bottom:16px;left:16px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:12px 14px;font-size:11px;color:var(--text-dim);
    width:236px;
  }
  #legend .lg-title{color:var(--text);font-size:11px;margin-bottom:8px;font-weight:600;}
  #legend .grad{height:10px;border-radius:5px;margin:4px 0 2px 0;}
  #legend .grad-labels{display:flex;justify-content:space-between;font-size:10px;}

  #count{
    position:absolute;top:16px;right:16px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:8px 12px;font-family:var(--mono);
    font-size:11px;color:var(--text-dim);
  }

  #exportPanel{
    position:absolute;top:16px;right:16px;margin-top:52px;width:220px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:14px;font-size:12px;
  }
  #exportPanel h2{
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);margin:0 0 10px 0;font-weight:600;
  }
  #exportPanel .row{margin-bottom:9px;}
  #exportPanel label{display:block;color:var(--text-dim);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  #exportPanel input[type=text]{
    width:100%;background:#1a1f2b;color:var(--text);
    border:1px solid var(--panel-border);border-radius:6px;
    padding:6px 8px;font-size:12px;font-family:var(--mono);
  }
  .expBtns{display:flex;gap:8px;margin-top:10px;}
  .expBtn{
    flex:1;background:var(--accent-dim);color:var(--accent);
    border:1px solid var(--accent-dim);border-radius:6px;
    padding:7px 0;font-size:11.5px;font-weight:600;cursor:pointer;
    letter-spacing:.03em;
  }
  .expBtn:hover{background:var(--accent);color:#0b0d12;}
  #exportNote{color:var(--text-dim);font-size:10px;line-height:1.4;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap"></div>

  <div id="panel">
    <h1>Action Space</h1>
    <div class="sub">5D factor-score explorer</div>

    <div class="row axis-x">
      <label>X axis</label>
      <select id="sel-x"></select>
    </div>
    <div class="row axis-y">
      <label>Y axis</label>
      <select id="sel-y"></select>
    </div>
    <div class="row axis-z">
      <label>Z axis</label>
      <select id="sel-z"></select>
    </div>

    <div class="divider"></div>

    <div class="row">
      <label><span class="colorswatch" style="background:linear-gradient(90deg,#3fae5e,#e6483c)"></span>Colour: red&ndash;green (a*)</label>
      <select id="sel-rg"></select>
    </div>
    <div class="row">
      <label><span class="colorswatch" style="background:linear-gradient(90deg,#3f6fe6,#e6c93f)"></span>Colour: blue&ndash;yellow (b*)</label>
      <select id="sel-by"></select>
    </div>

    <div class="divider"></div>

    <div class="toggles">
      <label><input type="checkbox" id="toggle-labels"> Show all labels</label>
      <label><input type="checkbox" id="toggle-spin"> Auto-rotate</label>
    </div>
    <div class="row" style="margin-top:8px;">
      <label>Point size</label>
      <input type="range" id="sizeSlider" min="0.4" max="2.2" step="0.1" value="1">
    </div>

    <div id="hint">Drag to rotate &middot; scroll to zoom &middot; hover a sphere for its name &middot; right-drag to pan</div>
  </div>

  <div id="count"></div>

  <div id="exportPanel">
    <h2>Export figure</h2>
    <div class="row">
      <label>Resolution</label>
      <select id="exp-res">
        <option value="1">Screen (1&times;)</option>
        <option value="2" selected>Print (2&times;)</option>
        <option value="4">High-res print (4&times;)</option>
      </select>
    </div>
    <div class="row">
      <label>Background</label>
      <select id="exp-bg">
        <option value="dark">Dark (on-screen theme)</option>
        <option value="light">White</option>
        <option value="transparent">Transparent (PNG only)</option>
      </select>
    </div>
    <div class="row">
      <label>Filename</label>
      <input type="text" id="exp-name" value="action_space">
    </div>
    <div class="expBtns">
      <button class="expBtn" id="btn-png">PNG</button>
      <button class="expBtn" id="btn-pdf">PDF</button>
    </div>
    <div id="exportNote">Captures the current rotation exactly as framed. Transparent falls back to white for PDF.</div>
  </div>

  <div id="tooltip"></div>

  <div id="legend">
    <div class="lg-title">Colour = opponent channels (CIELAB)</div>
    <div class="grad" style="background:linear-gradient(90deg,#3fae5e,#8f8f8f,#e6483c)"></div>
    <div class="grad-labels"><span id="rg-lo">green</span><span id="rg-hi">red</span></div>
    <div class="grad" style="background:linear-gradient(90deg,#3f6fe6,#8f8f8f,#e6c93f)"></div>
    <div class="grad-labels"><span id="by-lo">blue</span><span id="by-hi">yellow</span></div>
  </div>
</div>

const FACTORS = DATA.factors;
const ACTIONS = DATA.actions;

/* ---------- STATE ---------- */
let axisX = FACTORS[0], axisY = FACTORS[1], axisZ = FACTORS[2];
let colorRG = FACTORS[3], colorBY = FACTORS[4];

let pointScale = 1;

/* min/max per factor for normalisation */
const RANGE = {};
FACTORS.forEach(f=>{
  let vals = ACTIONS.map(a=>a[f]);
  RANGE[f] = {min: Math.min(...vals), max: Math.max(...vals)};
});
function norm(f, v){ // -> [-1, 1]
  const r = RANGE[f];
  const mid = (r.max + r.min)/2, half = (r.max - r.min)/2 || 1;
  return (v - mid) / half;
}

/* ---------- Lab -> RGB (opponent colour axes) ---------- */
function labToRgb(L, a, b){
  let y = (L + 16) / 116;
  let x = a / 500 + y;
  let z = y - b / 200;
  function inv(t){ return t*t*t > 0.008856 ? t*t*t : (t - 16/116)/7.787; }
  x = 0.95047 * inv(x); y = 1.00000 * inv(y); z = 1.08883 * inv(z);
  let r =  x*3.2406 + y*-1.5372 + z*-0.4986;
  let g =  x*-0.9689 + y*1.8758 + z*0.0415;
  let bl = x*0.0557 + y*-0.2040 + z*1.0570;
  function gam(c){ c = c<=0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055; return Math.min(1,Math.max(0,c)); }
  return [gam(r), gam(g), gam(bl)];
}
function actionColor(a){
  const t1 = norm(colorRG, a[colorRG]); // -1..1 -> green..red
  const t2 = norm(colorBY, a[colorBY]); // -1..1 -> blue..yellow
  // CIELAB opponent channels: +a=red/-a=green, +b=yellow/-b=blue
  const [r,g,b] = labToRgb(62, t1*70, t2*70);
  return new THREE.Color(r,g,b);
}

/* --- custom orbit controls (no external addon needed) --- */
let spherical = {radius: 15, theta: Math.PI*0.28, phi: Math.PI*0.38};
let target = new THREE.Vector3(0,0,0);
let dragging = false, panning = false, lastX=0, lastY=0;
function updateCamera(){
  const s = spherical;
  const x = target.x + s.radius * Math.sin(s.phi) * Math.sin(s.theta);
  const y = target.y + s.radius * Math.cos(s.phi);
  const z = target.z + s.radius * Math.sin(s.phi) * Math.cos(s.theta);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', e=>{
  if(e.button===2){ panning = true; } else { dragging = true; }
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', ()=>{dragging=false; panning=false;});
window.addEventListener('mousemove', e=>{
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if(dragging){
    spherical.theta -= dx * 0.006;
    spherical.phi -= dy * 0.006;
    spherical.phi = Math.max(0.08, Math.min(Math.PI-0.08, spherical.phi));
    updateCamera();
  } else if(panning){
    const panSpeed = spherical.radius * 0.0012;
    const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(camRight, -dx*panSpeed);
    target.addScaledVector(camUp, dy*panSpeed);
    updateCamera();
  }
});
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  spherical.radius *= (1 + Math.sign(e.deltaY)*0.08);
  spherical.radius = Math.max(4, Math.min(40, spherical.radius));
  updateCamera();
}, {passive:false});

/* ---------- themes (screen vs. publication export) ---------- */
const THEMES = {

  light: {bg:0xffffff, grid:0xc7cdd8, axis:{x:0xc0392b,y:0x1e8449,z:0x1a5fb4}, low:'#8a92a3', labelText:'#20242e'}
};
let activeTheme = 'dark';
function applyTheme(name){

/* ---------- axes, grid, ticks ---------- */
let axesGroup = new THREE.Group();
scene.add(axesGroup);

function makeTextSprite(text, color){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 44;
  ctx.font = `600 ${fontSize}px ${getComputedStyle(document.body).fontFamily}`;
  const w = Math.ceil(ctx.measureText(text).width) + 24;
  canvas.width = w; canvas.height = fontSize*1.5;
  ctx.font = `600 ${fontSize}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 12, canvas.height/2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true});
  const sprite = new THREE.Sprite(mat);
  const scaleF = 0.014;
  sprite.scale.set(canvas.width*scaleF, canvas.height*scaleF, 1);
  sprite.renderOrder = 999;
  return sprite;
}

function buildAxes(){
  while(axesGroup.children.length) axesGroup.remove(axesGroup.children[0]);
  const theme = THEMES[activeTheme];

  const grid = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(HALF*2,HALF*2,HALF*2)),
    new THREE.LineBasicMaterial({color:theme.grid, transparent:true, opacity:0.55})
  );
  axesGroup.add(grid);

  const axisDefs = [
    {dir:new THREE.Vector3(1,0,0), color:theme.axis.x, label:axisX},
    {dir:new THREE.Vector3(0,1,0), color:theme.axis.y, label:axisY},
    {dir:new THREE.Vector3(0,0,1), color:theme.axis.z, label:axisZ},
  ];
  axisDefs.forEach(ax=>{
    const points = [ax.dir.clone().multiplyScalar(-HALF-0.3), ax.dir.clone().multiplyScalar(HALF+0.3)];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({color:ax.color});
    axesGroup.add(new THREE.Line(geo, mat));

    const labelPos = ax.dir.clone().multiplyScalar(HALF+1.0);
    const sprite = makeTextSprite(ax.label, '#'+ax.color.toString(16).padStart(6,'0'));
    sprite.position.copy(labelPos);
    axesGroup.add(sprite);

    const labelNeg = makeTextSprite('low', theme.low);
    labelNeg.scale.multiplyScalar(0.55);
    labelNeg.position.copy(ax.dir.clone().multiplyScalar(-HALF-0.9));
    axesGroup.add(labelNeg);
  });
}
buildAxes();

/* ---------- points ---------- */
const sphereGeo = new THREE.SphereGeometry(0.085, 16, 16);
let pointMeshes = [];
let pointsGroup = new THREE.Group();
scene.add(pointsGroup);

function buildPoints(){
  while(pointsGroup.children.length) pointsGroup.remove(pointsGroup.children[0]);
  pointMeshes = [];
  ACTIONS.forEach(a=>{
    const mat = new THREE.MeshStandardMaterial({
      color: actionColor(a), roughness:0.4, metalness:0.15,
      emissive: 0x000000
    });
    const mesh = new THREE.Mesh(sphereGeo, mat);
    mesh.position.set(
      norm(axisX, a[axisX]) * HALF,
      norm(axisY, a[axisY]) * HALF,
      norm(axisZ, a[axisZ]) * HALF
    );
    mesh.scale.setScalar(pointScale);
    mesh.userData = a;
    pointsGroup.add(mesh);
    pointMeshes.push(mesh);
  });
}
buildPoints();

/* ---------- HTML labels (projected each frame) ---------- */
const labelLayer = document.getElementById('app');
let labelDivs = new Map();
function ensureLabelDivs(){
  labelDivs.forEach(d=>d.remove());
  labelDivs.clear();
  if(!showAllLabels) return;
  pointMeshes.forEach(m=>{
    const div = document.createElement('div');
    div.className = 'labelDiv';
    div.textContent = m.userData['Action Name'];
    labelLayer.appendChild(div);
    labelDivs.set(m, div);
  });
}
ensureLabelDivs();

/* ---------- hover tooltip + highlight ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null;

renderer.domElement.addEventListener('mousemove', e=>{
  mouse.x = (e.clientX/window.innerWidth)*2 - 1;
  mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
});

function pickHover(){
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pointMeshes);
  if(hits.length){
    const m = hits[0].object;
    if(hovered !== m){
      if(hovered) hovered.scale.setScalar(pointScale);
      hovered = m;
      hovered.scale.setScalar(pointScale*1.9);
    }
    const a = m.userData;
    tooltip.innerHTML = `<span class="name">${a['Action Name']}</span><br>` +
      FACTORS.map(f=>`<span class="f">${f}:</span> ${a[f].toFixed(2)}`).join('<br>');
    tooltip.style.display = 'block';
  } else {
    if(hovered){ hovered.scale.setScalar(pointScale); hovered = null; }
    tooltip.style.display = 'none';
  }
}

window.addEventListener('mousemove', e=>{
  tooltip.style.left = (e.clientX+14)+'px';
  tooltip.style.top = (e.clientY+14)+'px';

function reassign(newVal, role){
  const slots = {x:'axisX', y:'axisY', z:'axisZ', rg:'colorRG', by:'colorBY'};
  const vars = {axisX, axisY, axisZ, colorRG, colorBY};
  // find who currently holds newVal, swap with role's old value
  const oldVal = vars[slots[role]];
  let holderRole = null;
  for(const r in slots){ if(vars[slots[r]] === newVal) holderRole = r; }
  vars[slots[role]] = newVal;
  if(holderRole && holderRole !== role) vars[slots[holderRole]] = oldVal;
  axisX=vars.axisX; axisY=vars.axisY; axisZ=vars.axisZ; colorRG=vars.colorRG; colorBY=vars.colorBY;
  refreshSelects();
  buildAxes();
  buildPoints();
  ensureLabelDivs();
}

selBY.addEventListener('change', e=>reassign(e.target.value,'by'));

document.getElementById('toggle-labels').addEventListener('change', e=>{
  showAllLabels = e.target.checked;
  ensureLabelDivs();
});
document.getElementById('toggle-spin').addEventListener('change', e=>{
  autoRotate = e.target.checked;
});
document.getElementById('sizeSlider').addEventListener('input', e=>{
  pointScale = parseFloat(e.target.value);
  pointMeshes.forEach(m=>{ if(m!==hovered) m.scale.setScalar(pointScale); });
});

document.getElementById('count').textContent = ACTIONS.length + ' actions';

/* ---------- publication export ---------- */
const exportRenderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, alpha:true});
// not attached to the DOM - renders off-screen so the live view never flickers

function captureCanvas(multiplier, bgMode){
  const w = Math.min(6000, Math.round(window.innerWidth * multiplier));
  const h = Math.min(6000, Math.round(window.innerHeight * multiplier));

  // clear any hover highlight so the export is clean
  if(hovered){ hovered.scale.setScalar(pointScale); hovered = null; }
  tooltip.style.display = 'none';

  const savedAspect = camera.aspect;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const themeForExport = (bgMode === 'transparent') ? 'light' : bgMode;
  applyTheme(themeForExport);

  exportRenderer.setSize(w, h, false);
  if(bgMode === 'transparent'){
    exportRenderer.setClearColor(0x000000, 0);
  } else {
    exportRenderer.setClearColor(THEMES[themeForExport].bg, 1);
  }
  exportRenderer.render(scene, camera);

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(exportRenderer.domElement, 0, 0, w, h);

  if(showAllLabels){
    ctx.font = `${Math.round(13*multiplier)}px monospace`;
    ctx.fillStyle = THEMES[themeForExport].labelText;
    ctx.textBaseline = 'middle';
    const proj = new THREE.Vector3();
    pointMeshes.forEach(m=>{
      proj.copy(m.position).project(camera);
      if(proj.z > 1) return;
      const x = (proj.x*0.5+0.5)*w;
      const y = (-proj.y*0.5+0.5)*h;
      ctx.fillText(m.userData['Action Name'], x + 6*multiplier, y - 6*multiplier);
    });
  }

  // revert to live view
  camera.aspect = savedAspect;
  camera.updateProjectionMatrix();
  applyTheme('dark');

  return canvas;
}

function exportFilename(){
  return (document.getElementById('exp-name').value || 'action_space').trim().replace(/[^a-z0-9_\-]/gi,'_');
}

document.getElementById('btn-png').addEventListener('click', ()=>{
  const multiplier = parseFloat(document.getElementById('exp-res').value);
  const bgMode = document.getElementById('exp-bg').value;
  const canvas = captureCanvas(multiplier, bgMode);
  const link = document.createElement('a');
  link.download = exportFilename() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('btn-pdf').addEventListener('click', ()=>{
  const multiplier = parseFloat(document.getElementById('exp-res').value);
  let bgMode = document.getElementById('exp-bg').value;
  if(bgMode === 'transparent') bgMode = 'light'; // PDFs need an opaque page
  const canvas = captureCanvas(multiplier, bgMode);
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const dpi = 300;
  const wIn = canvas.width / dpi, hIn = canvas.height / dpi;
  const pdf = new jsPDF({orientation: wIn > hIn ? 'landscape' : 'portrait', unit:'in', format:[wIn, hIn]});
  pdf.addImage(imgData, 'PNG', 0, 0, wIn, hIn);
  pdf.save(exportFilename() + '.pdf');
});

/* ---------- resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- render loop ---------- */
const projVec = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate){ spherical.theta += 0.0028; updateCamera(); }
  pickHover();

  if(showAllLabels){
    labelDivs.forEach((div, mesh)=>{
      projVec.copy(mesh.position).project(camera);
      const x = (projVec.x*0.5+0.5)*window.innerWidth;
      const y = (-projVec.y*0.5+0.5)*window.innerHeight;
      const behind = projVec.z > 1;
      div.style.display = behind ? 'none' : 'block';
      div.style.left = x+'px';
      div.style.top = y+'px';
    });
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
